name: publish pybgzf

on:
  push:
    tags: '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.20

jobs:
  on-main-branch-check:
    name: on-main-branch-check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository and its history
    outputs:
      on_main: ${{ steps.contains_tag.outputs.retval }}
    steps:
      - name: Stop following the remote HEAD so the tag check sees every branch
        run: git config --global remote.origin.followRemoteHEAD never

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on the main branch
        uses: rickstaa/action-contains-tag@a9ff27d505ba2bf074a2ebb48b208e76d35ff308 # v1.2.10
        id: contains_tag
        with:
          reference: "main"
          tag: "${{ github.ref_name }}"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TAG" != "$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml"
            exit 1
          fi

  tests:
    name: tests
    needs: on-main-branch-check
    if: ${{ needs.on-main-branch-check.outputs.on_main == 'true' }}
    permissions:
      contents: read  # to check out the repository in the called workflow
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] GitHub does not document $/ for reusable workflows

  build-wheels:
    name: build-wheels
    needs: tests
    permissions:
      contents: read  # to check out the repository in the called workflow
    uses: ./.github/workflows/wheels.yml # zizmor: ignore[self-repository] GitHub does not document $/ for reusable workflows

  build-sdist:
    name: build-sdist
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: "false"

      - name: Build the source distribution
        run: uv build --sdist

      - name: Print the contents of the source distribution
        run: tar -tzf dist/*.tar.gz

      - name: Upload the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pybgzf-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-sdist:
    name: verify-sdist (${{ matrix.python-version }})
    needs: build-sdist
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pybgzf-sdist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build and import the source distribution
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv run --no-project --python "$PYTHON_VERSION" --with dist/*.tar.gz python -P - <<'PY'
          import gzip
          import io

          import pybgzf

          stream = io.BytesIO()
          with pybgzf.BgzfWriter(stream, threads=2) as writer:
              writer.write(b"built from source\n")
          assert gzip.decompress(stream.getvalue()) == b"built from source\n"
          print("pybgzf builds from its source distribution")
          PY

  check-distributions:
    name: check-distributions
    needs: [build-wheels, verify-sdist]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pybgzf-*
          path: dist/
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Check the package metadata
        run: |
          ls -l dist/
          uv run --no-project --with twine twine check --strict dist/*

  publish-to-pypi:
    name: publish-to-pypi
    runs-on: ubuntu-latest
    needs: check-distributions
    environment: pypi
    permissions:
      id-token: write  # to publish to PyPI as a trusted publisher
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pybgzf-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          print-hash: true
          verbose: true

  make-changelog:
    name: make-changelog
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    permissions:
      contents: read  # to check out the tagged commit and its history
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Check out the repository at the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: pyproject.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: ${{ github.repository }}

  make-github-release:
    name: make-github-release
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write  # to create the GitHub release
    needs: [check-distributions, make-changelog]
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pybgzf-*
          path: dist/
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.make-changelog.outputs.release_body }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"
