name: tests

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.20
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check the Rust formatting
        run: cargo fmt --check

      - name: Lint the Rust code
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test the Rust code
        run: cargo test --no-default-features --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: "false"

      - name: Check the lockfile, project metadata, formatting, lint, and types
        run: |
          uv run --locked poe check-lock
          uv run --locked poe check-pyproject
          uv run --locked poe check-format
          uv run --locked poe check-lint
          uv run --locked poe check-typing

  unit-tests:
    name: unit-tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install htslib to compare against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tabix

      - name: Install htslib to compare against
        if: runner.os == 'macOS'
        run: brew install htslib

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Test the library
        run: uv run --locked poe check-tests
